receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
     config:
       scrape_configs:
       # Defaults point at the in-cluster lab services; override with env vars
       # (e.g. start-otel.sh sets these for a local Docker run).
       # Scrape every dcgm-exporter pod (one per GPU node). Scraping the Service
       # only reaches one node per scrape. Requires the RBAC in otel-collector.yaml.
       - job_name: dcgm
         scrape_interval: 60s
         kubernetes_sd_configs:
         - role: endpointslice
           namespaces:
             names: [gpu-operator]
         relabel_configs:
         - source_labels: [__meta_kubernetes_service_name]
           regex: nvidia-dcgm-exporter
           action: keep
       - job_name: llama-3.1-nemotron-70b-instruct
         scrape_interval: 10s
         metrics_path: /metrics
         static_configs:
         - targets:
            - ${env:NIM1_TARGET:-nemotron-70b-instruct.nim-service:8000}
       - job_name: llama-3.1-nemoguard-8b-content-safety
         scrape_interval: 10s
         metrics_path: /v1/metrics
         static_configs:
         - targets:
            - ${env:NIM2_TARGET:-content-safety.nim-service:8000}
       - job_name: llama-3.1-nemoguard-8b-topic-control
         scrape_interval: 10s
         metrics_path: /v1/metrics
         static_configs:
         - targets:
            - ${env:NIM3_TARGET:-topic-control.nim-service:8000}
       - job_name: nv-embedqa-e5-v5
         scrape_interval: 10s
         metrics_path: /v1/metrics
         static_configs:
         - targets:
            - ${env:NIM4_TARGET:-embedqa-e5-v5.nim-service:8000}
processors:
  cumulativetodelta:
    max_staleness: 25h
  # Kubernetes enrichment for OTLP data
  # https://docs.dynatrace.com/docs/ingest-from/opentelemetry/collector/use-cases/kubernetes/k8s-enrich
  # Requires the ClusterRole in otel-collector.yaml and CLUSTER_NAME env var.
  k8sattributes:
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.deployment.name
        - k8s.replicaset.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.job.name
        - k8s.cronjob.name
        - k8s.container.name
      annotations:
        - from: pod
          key: metadata.dynatrace.com
          tag_name: metadata.dynatrace.com
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection
  transform:
    error_mode: ignore
    trace_statements: &k8s_transform
      - context: resource
        statements:
          - set(attributes["k8s.cluster.name"], "${env:CLUSTER_NAME}")
          - set(attributes["k8s.workload.kind"], "job") where IsString(attributes["k8s.job.name"])
          - set(attributes["k8s.workload.name"], attributes["k8s.job.name"]) where IsString(attributes["k8s.job.name"])
          - set(attributes["k8s.workload.kind"], "cronjob") where IsString(attributes["k8s.cronjob.name"])
          - set(attributes["k8s.workload.name"], attributes["k8s.cronjob.name"]) where IsString(attributes["k8s.cronjob.name"])
          - set(attributes["k8s.workload.kind"], "daemonset") where IsString(attributes["k8s.daemonset.name"])
          - set(attributes["k8s.workload.name"], attributes["k8s.daemonset.name"]) where IsString(attributes["k8s.daemonset.name"])
          - set(attributes["k8s.workload.kind"], "statefulset") where IsString(attributes["k8s.statefulset.name"])
          - set(attributes["k8s.workload.name"], attributes["k8s.statefulset.name"]) where IsString(attributes["k8s.statefulset.name"])
          - set(attributes["k8s.workload.kind"], "replicaset") where IsString(attributes["k8s.replicaset.name"])
          - set(attributes["k8s.workload.name"], attributes["k8s.replicaset.name"]) where IsString(attributes["k8s.replicaset.name"])
          - set(attributes["k8s.workload.kind"], "deployment") where IsString(attributes["k8s.deployment.name"])
          - set(attributes["k8s.workload.name"], attributes["k8s.deployment.name"]) where IsString(attributes["k8s.deployment.name"])
          # Merge Dynatrace Operator metadata annotation (JSON), if present
          - merge_maps(attributes, ParseJSON(attributes["metadata.dynatrace.com"]), "upsert") where IsString(attributes["metadata.dynatrace.com"])
          - delete_key(attributes, "metadata.dynatrace.com")
    metric_statements: *k8s_transform
    log_statements: *k8s_transform
  # Traces only (kept separate from "transform" above, whose statement list is shared with metrics and
  # logs, where span-context statements are not valid).
  # The LangChain instrumentation labels the agent's LLM calls provider "Langchain" and model "unknown",
  # which splits them from the NeMo Guardrails spans in the GenAI Smartscape. Relabel them as the NIM
  # model the agent uses. Keep the model name in sync with llms.nim_llm.model_name in
  # src/nat_simple_web_query/configs/config.yml.k8s. Only spans still labelled "unknown" are changed,
  # and request.model is set last so the "unknown" test holds for every statement before it.
  transform/genai:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(span.attributes["gen_ai.provider.name"], "nim") where instrumentation_scope.name == "opentelemetry.instrumentation.langchain" and span.attributes["gen_ai.request.model"] == "unknown"
          - set(span.attributes["gen_ai.system"], "nim") where instrumentation_scope.name == "opentelemetry.instrumentation.langchain" and span.attributes["gen_ai.request.model"] == "unknown"
          - set(span.attributes["gen_ai.response.model"], "nvidia/llama-3.1-nemotron-70b-instruct") where instrumentation_scope.name == "opentelemetry.instrumentation.langchain" and span.attributes["gen_ai.request.model"] == "unknown"
          - set(span.attributes["gen_ai.request.model"], "nvidia/llama-3.1-nemotron-70b-instruct") where instrumentation_scope.name == "opentelemetry.instrumentation.langchain" and span.attributes["gen_ai.request.model"] == "unknown"

  # Metrics counterpart of transform/genai. The LangChain instrumentation's gen_ai.client.* metrics carry
  # gen_ai.system="Langchain" but no gen_ai.provider.name and no gen_ai.request.model, so the AI
  # Observability dashboard's provider filter and per-model latency tiles match nothing. Add the provider
  # (same value transform/genai sets on spans) and copy the response model into the request model.
  transform/genai-metrics:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["gen_ai.provider.name"], "nim") where (metric.name == "gen_ai.client.token.usage" or metric.name == "gen_ai.client.operation.duration") and attributes["gen_ai.system"] == "Langchain" and attributes["gen_ai.provider.name"] == nil
          - set(attributes["gen_ai.request.model"], attributes["gen_ai.response.model"]) where (metric.name == "gen_ai.client.token.usage" or metric.name == "gen_ai.client.operation.duration") and attributes["gen_ai.request.model"] == nil and attributes["gen_ai.response.model"] != nil

exporters:
  otlphttp:
    endpoint: "${env:DT_BASE_URL}/api/v2/otlp"
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [k8sattributes, transform, transform/genai]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp,prometheus]
      processors: [k8sattributes, transform, transform/genai-metrics, cumulativetodelta]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [k8sattributes, transform]
      exporters: [otlphttp]
  telemetry:
    logs:
      level: "debug"